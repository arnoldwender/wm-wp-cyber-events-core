name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The plugin header requires PHP 8.3; until 2026-09-15 this ran 8.1 and 8.2, which the plugin
        # does not support, and never ran a version above its requirement.
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, mbstring, json, openssl, libxml, simplexml

      - name: Syntax Linting
        run: find . -name "*.php" ! -path "./vendor/*" -exec php -l {} +

      - name: Verify ABSPATH guards
        run: |
          for file in $(find includes -name "*.php"); do
            if ! grep -q "defined( 'ABSPATH' )" "$file"; then
              echo "Error: Missing ABSPATH check in $file"
              exit 1
            fi
          done

      - name: Run Standalone Test Suites
        # Explicit entry points: the other files in tests/ need WordPress (wp eval-file) and exit 1 or
        # print nothing outside it.
        # Exit 0 alone is not green: a PHP file that leaves PHP mode early prints its source and exits 0
        # without running an assertion. The suite must also print its results line with 0 failures.
        run: |
          set +e
          out=$(php tests/test-suite.php 2>&1); code=$?
          set -e
          printf '%s\n' "$out"
          [ "$code" -eq 0 ]
          printf '%s\n' "$out" | grep -Eq '^  TEST SUITE RESULTS: [1-9][0-9]* PASSED \| 0 FAILED$'

      # `wp i18n make-pot` IS the definition of a fresh catalog in the step below, so wp-cli is a
      # hard requirement there rather than something it shrugs off. Into $HOME/bin, not the
      # workspace: an executable in the repo root would land in the copy the mutation runner makes.
      # No workflow input reaches these commands; the URL is a literal.
      - name: Install WP-CLI
        if: matrix.php-version == '8.3'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$HOME/bin/wp"
          chmod +x "$HOME/bin/wp"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # 307 of the 885 translatable strings had no entry on 2026-09-20 — the ones the 2026-09-15
      # rewrite added, the waiting room among them. A string with no entry cannot be translated at all.
      - name: Translation catalog freshness
        if: matrix.php-version == '8.3'
        run: php tests/test-pot-freshness.php

      - name: Mutation Check
        # Each correction of 2026-09-15 undone once; the suite must turn red every time (control run first).
        run: bash tests/run-mutations.sh

      - name: Invoice XML validation (Mustang-CLI, EN 16931)
        # Invoices and credit notes generated by the plugin, validated against the EN 16931 schematron.
        # Java is preinstalled on the runner; the script pins the Mustang-CLI jar by SHA-256.
        run: |
          java -version
          bash tests/validate-invoice-xml.sh

      - name: Compliance & Security Audit
        run: python3 .github/scripts/security-audit.py

      - name: CRA / SBOM Validation
        run: |
          # El mandato SBOM del Cyber Resilience Act aplica desde el 2027-12-11.
          # Hasta que la flota tenga SBOMs esto avisa, no rompe el build.
          if [ ! -f "bom.json" ]; then
            echo "::warning::bom.json (SBOM) ausente — pendiente para el CRA (2027-12-11)."
          else
            echo "bom.json presente."
          fi

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 with mysqli
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, json, openssl, libxml, simplexml, mysqli

      - name: Verify MySQL 8.0 InnoDB atomic last-seat guard under 50 concurrent updates
        run: |
          php -r '$m = new mysqli("127.0.0.1", "root", "root", "wp_test", 3306); $m->query("CREATE TABLE t_sessions (id INT PRIMARY KEY, kapazitaet INT NOT NULL, belegt INT NOT NULL) ENGINE=InnoDB"); $m->query("INSERT INTO t_sessions VALUES (1, 1, 0)"); $wins = 0; for ($i = 0; $i < 50; $i++) { $c = new mysqli("127.0.0.1", "root", "root", "wp_test", 3306); $c->query("UPDATE t_sessions SET belegt = belegt + 1 WHERE id = 1 AND belegt < kapazitaet"); if ($c->affected_rows === 1) { $wins++; } $c->close(); } $belegt = (int) $m->query("SELECT belegt FROM t_sessions WHERE id = 1")->fetch_row()[0]; if ($wins !== 1 || $belegt !== 1) { exit(1); } echo "MySQL 8.0 atomic seat guard verified: wins={$wins} belegt={$belegt}\n";'
